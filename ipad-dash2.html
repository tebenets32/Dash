<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dash</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dash">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
html.wp,html.wp body{background:transparent}
body{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:3vw 4vw 2vw}
#top{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:flex-start;align-items:flex-start}
#clock{text-shadow:0 2px 14px rgba(0,0,0,.55)}
#time{font-size:9vw;font-weight:200;letter-spacing:-1px;line-height:1}
#ampm{font-size:2.6vw;font-weight:300;color:#d1d1d6;margin-left:6px;letter-spacing:0}
#date{font-size:2.8vw;color:#d1d1d6;margin-top:10px}
.pill{background:rgba(60,60,67,.65);color:#0a84ff;border:0;border-radius:14px;padding:12px 22px;font-size:20px;margin-left:10px}
#exit{color:#ff453a}
#edit.on{background:#ff9f0a;color:#000}
#dockwrap{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center}
#dock{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(20px);border-radius:34px;padding:14px 12px 8px;max-width:100%}
.tile{display:block;width:11vw;margin:0 .6vw 8px;text-align:center;text-decoration:none;color:#fff}
.ic{height:11vw;background:rgba(28,28,30,.88);border-radius:26px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.tile:active .ic{background:#3a3a3c}
.ic i{font-style:normal;font-size:5.4vw;line-height:1}
.tile span{display:block;font-size:1.9vw;margin-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.editing .ic{background:#3b2a00}
.add .ic{background:#0b2a4a !important;color:#0a84ff}
#blank{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:99;color:#3a3a3c;font-size:22px;text-align:center;padding-top:44%}
#blank p{margin:0 auto;max-width:520px}
</style>
</head>
<body>
<div id="top">
  <div id="clock"><span id="time"></span><span id="ampm"></span><div id="date"></div></div>
  <div><button id="edit" class="pill" type="button">Edit</button><button id="exit" class="pill" type="button">Exit</button></div>
</div>
<div id="dockwrap"><div id="dock"></div></div>
<div id="blank"><p>Screen dimmed. Press the Home button to leave the app, or tap anywhere to return.</p></div>
<script>
(function () {
  var KEY = 'dash2';
  var MAP = '\uD83D\uDDFA';
  var defaults = {
    engine: 'apple',
    dock: [
      { l: 'Map', i: MAP, t: 'map' },
      { l: 'YouTube', i: '\u25B6\uFE0F', u: 'youtube://' },
      { l: 'VLC', i: '\uD83D\uDD36', u: 'vlc://' },
      { l: 'Messages', i: '\uD83D\uDCAC', u: 'sms://' },
      { l: 'Waze', i: '\uD83D\uDE97', u: 'waze://' }
    ]
  };
  var ENG = ['apple', 'google', 'sygic'];
  var ENGNAME = { apple: 'Apple Maps', google: 'Google Maps', sygic: 'Sygic' };
  var data, editing = false;

  if (window.location.protocol === 'file:') { document.documentElement.className = 'wp'; }

  function load() {
    try {
      var s = window.localStorage.getItem(KEY);
      if (s) { data = JSON.parse(s); }
    } catch (e) {}
    if (!data || !data.dock) { data = JSON.parse(JSON.stringify(defaults)); }
  }
  function save() {
    try { window.localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }
  function eng() { return ENGNAME[data.engine] ? data.engine : 'apple'; }
  function mapUrl() {
    var e = eng();
    if (e === 'sygic') { return 'com.sygic.aura://'; }
    if (e === 'google') { return 'comgooglemaps://'; }
    return 'http://maps.apple.com/';
  }
  function tile(idx, it, cls) {
    return '<a class="tile ' + (cls || '') + '" href="#" data-i="' + idx + '"><div class="ic"><i>' +
      it.i + '</i></div><span>' + esc(it.l) + '</span></a>';
  }
  function render() {
    var h = '', j;
    for (j = 0; j < data.dock.length; j++) { h += tile(j, data.dock[j]); }
    if (editing) {
      h += tile('add', { i: '+', l: 'Add app' }, 'add');
      h += tile('eng', { i: MAP, l: ENGNAME[eng()] }, 'add');
    }
    document.getElementById('dock').innerHTML = h;
    document.body.className = editing ? 'editing' : '';
    var b = document.getElementById('edit');
    b.innerHTML = editing ? 'Done' : 'Edit';
    b.className = 'pill' + (editing ? ' on' : '');
  }
  function go(url) { window.location.href = url; }

  function onTap(e) {
    var el = e.target;
    while (el && el !== document && !(el.getAttribute && el.getAttribute('data-i'))) { el = el.parentNode; }
    if (!el || el === document) { return; }
    e.preventDefault();
    var i = el.getAttribute('data-i'), it, label, v;
    if (i === 'eng') {
      data.engine = ENG[(ENG.indexOf(eng()) + 1) % ENG.length];
      save(); render(); return;
    }
    if (i === 'add') {
      label = window.prompt('App name (e.g. Netflix)');
      if (!label) { return; }
      v = window.prompt('URL scheme for ' + label + ' (e.g. nflx://)');
      if (!v) { return; }
      data.dock.push({ l: label, i: '\uD83D\uDCF1', u: v });
      save(); render(); return;
    }
    i = parseInt(i, 10);
    it = data.dock[i];
    if (editing) {
      if (window.confirm('Remove ' + it.l + '?')) { data.dock.splice(i, 1); save(); render(); }
      return;
    }
    go(it.t === 'map' ? mapUrl() : it.u);
  }

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) { h = 12; }
    document.getElementById('time').innerHTML = h + ':' + (m < 10 ? '0' : '') + m;
    document.getElementById('ampm').innerHTML = ap;
    document.getElementById('date').innerHTML = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  }

  load(); render(); tick();
  window.setInterval(tick, 1000);
  document.getElementById('dock').addEventListener('click', onTap, false);
  document.getElementById('edit').addEventListener('click', function () { editing = !editing; render(); }, false);
  document.getElementById('exit').addEventListener('click', function () { document.getElementById('blank').style.display = 'block'; }, false);
  document.getElementById('blank').addEventListener('click', function () { this.style.display = 'none'; }, false);
})();
</script>
</body>
</html>
